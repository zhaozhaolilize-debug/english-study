<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>赵赵英语学习站</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface2: #f7f7f5;
  --border: #ececea;
  --text-primary: #1a1916;
  --text-secondary: #6b6960;
  --text-hint: #b0aea6;
  --accent: #2d6a4f;
  --accent-light: #e8f4ee;
  --accent2: #e76f51;
  --accent2-light: #fdf0ec;
  --kw-pink: #fce4ec;
  --kw-yellow: #fff8e1;
  --kw-purple: #ede7f6;
  --radius: 16px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --font-zh: -apple-system, 'PingFang SC', 'SF Pro Text', 'Microsoft YaHei', 'Noto Sans SC', 'DM Sans', sans-serif;
  --font-en: -apple-system, 'SF Pro Text', 'SF Pro Display', 'DM Sans', sans-serif;
  --font-num: -apple-system, 'SF Pro Text', 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); font-family: var(--font-zh); color: var(--text-primary); min-height: 100vh; max-width: 480px; margin: 0 auto; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ── HOME ── */
.home { display: block; padding-bottom: 80px; }
.home.hidden { display: none; }
.home-header { padding: 20px 20px 4px; display: flex; justify-content: space-between; align-items: center; }
.home-title-en { font-size: 26px; font-weight: 700; font-family: var(--font-en); letter-spacing: -0.5px; color: var(--text-primary); }
.home-title-zh { font-size: 14px; font-weight: 400; font-family: var(--font-zh); color: var(--text-secondary); margin-top: 2px; }
.home-subtitle { padding: 0 20px 16px; font-size: 13px; color: var(--text-hint); font-weight: 300; font-family: var(--font-en); }
.home-tabs { display: flex; padding: 0 16px; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.home-tab-btn { flex: 1; padding: 12px 4px; border: none; background: none; font-family: var(--font-zh); font-size: 13.5px; color: var(--text-hint); cursor: pointer; border-bottom: 2.5px solid transparent; transition: all 0.2s; }
.home-tab-btn.active { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 500; }
.episode-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
.episode-empty { padding: 60px 20px; text-align: center; color: var(--text-hint); font-size: 13px; }
.ep-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; border: 1px solid var(--border); display: flex; gap: 12px; padding: 12px; transition: transform 0.18s; }
.ep-card:active { transform: scale(0.98); }
.ep-thumbnail { width: 92px; height: 92px; flex-shrink: 0; border-radius: 10px; background: #1a1916; position: relative; overflow: hidden; }
.ep-thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ep-thumbnail-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#1a1916,#2d2c28); color: var(--text-hint); font-size: 11px; text-align: center; padding: 4px; }
.ep-body { flex: 1; min-width: 0; padding: 2px 0; }
.ep-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.ep-number { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.ep-duration { font-size: 12px; color: var(--text-hint); font-family: var(--font-num); }
.ep-tags { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.ep-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; font-weight: 300; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ep-meta { display: flex; justify-content: space-between; align-items: center; }
.ep-stats { display: flex; gap: 10px; }
.ep-stat { font-size: 11px; color: var(--text-hint); }
.ep-stat strong { color: var(--text-secondary); font-weight: 500; font-family: var(--font-num); }
.ep-date { font-size: 11px; color: var(--text-hint); font-family: var(--font-num); }

/* ── PLAYER ── */
.player-page { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
.player-page.active { display: flex; }
.video-wrap { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; flex-shrink: 0; }
.video-wrap video { width: 100%; height: 100%; display: block; }
.video-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111; color: #555; font-size: 13px; flex-direction: column; gap: 6px; }
.nav-row { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; }
.nav-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; }
.nav-left,.nav-right { display: flex; gap: 8px; }
.loop-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.8); font-size: 11px; padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
.loop-badge .loop-icon { display: flex; }

svg { display: block; }

/* Mode bar (5 mode-switch buttons, sits above the playback controls) */
.mode-bar { background: var(--surface); display: flex; justify-content: space-around; align-items: center; padding: 8px 2px; flex-shrink: 0; }
.mode-bar.collapsed { display: none; }
.mode-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 4px 2px; color: var(--text-hint); }
.mode-btn.active { color: var(--text-primary); }
.mode-label { font-size: 10px; font-family: var(--font-zh); }

/* Progress (now docked above controls at the bottom) */
.progress-wrap { background: var(--surface); padding: 8px 16px 0; border-top: 1px solid var(--border); flex-shrink: 0; }
.progress-bar-track { width: 100%; height: 3px; background: var(--border); border-radius: 3px; cursor: pointer; }
.progress-bar-fill { height: 100%; background: var(--text-primary); border-radius: 3px; transition: width 0.1s; }
.progress-times { display: flex; justify-content: space-between; padding: 5px 0 2px; }
.progress-time { font-size: 11px; color: var(--text-hint); font-variant-numeric: tabular-nums; font-family: var(--font-num); }

/* Controls */
.controls { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 10px 20px; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; position: relative; }
.ctrl-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--text-secondary); }
.ctrl-icon { display: flex; align-items: center; justify-content: center; line-height: 1; }
.ctrl-label { font-size: 10px; color: var(--text-secondary); font-family: var(--font-zh); }
.ctrl-btn.play-btn .ctrl-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--text-primary); color: #fff; display: flex; align-items: center; justify-content: center; }

/* ── NORMAL MODE ── */
.normal-content { flex: 1; overflow-y: auto; background: var(--bg); padding: 12px 16px; }
.sub-item { padding: 12px 12px; margin: 0 -12px 36px; border-radius: 10px; cursor: pointer; background: transparent; }
.sub-item.active { background: rgba(26,25,22,0.06); }
.sub-item.active .sub-en { color: var(--text-primary); font-weight: 600; }
.sub-item.active .sub-zh { color: var(--text-primary); font-weight: 400; }
.sub-en { font-size: 15px; line-height: 1.6; margin-bottom: 4px; font-weight: 400; font-family: var(--font-en); color: var(--text-secondary); }
.sub-zh { font-size: 13px; color: var(--text-secondary); line-height: 1.5; font-weight: 300; }
.sub-en .kw-pink { background: var(--kw-pink); padding: 1px 4px; border-radius: 4px; }
.sub-en .kw-yellow { background: var(--kw-yellow); padding: 1px 4px; border-radius: 4px; }
.sub-en .kw-purple { background: var(--kw-purple); padding: 1px 4px; border-radius: 4px; }
.sub-footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
.sub-num { font-size: 11px; color: var(--text-hint); font-family: var(--font-num); }
.sub-actions { display: flex; gap: 14px; align-items: center; }
.sub-action { background: none; border: none; cursor: pointer; color: var(--text-hint); padding: 2px; display: flex; }

/* ── DICTATION MODE ── */
.dictation-content { flex: 1; overflow-y: auto; background: var(--bg); }
.dict-item { padding: 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.dict-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.dict-num { font-size: 12px; color: var(--text-hint); font-family: var(--font-num); }
.dict-time { font-size: 12px; color: var(--text-hint); font-family: var(--font-num); }
.dict-actions { display: flex; gap: 8px; }
.dict-action { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text-hint); }
.dict-input-wrap { position: relative; }
.dict-input { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: var(--font-num); background: var(--surface2); color: var(--text-primary); resize: none; outline: none; min-height: 48px; transition: border 0.2s; }
.dict-input:focus { border-color: var(--accent); }
.dict-input.correct { border-color: var(--accent); background: var(--accent-light); }
.dict-input.wrong { border-color: var(--accent2); background: var(--accent2-light); }
.dict-answer { margin-top: 8px; padding: 10px 12px; background: var(--surface2); border-radius: 10px; font-size: 14px; color: var(--text-secondary); display: none; }
.dict-answer.show { display: block; }
.dict-check-btn { margin-top: 8px; padding: 6px 14px; border-radius: 8px; border: none; background: var(--text-primary); color: #fff; font-size: 13px; cursor: pointer; font-family: var(--font-num); }
.dict-reveal-btn { margin-top: 8px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--text-secondary); font-size: 13px; cursor: pointer; font-family: var(--font-num); }

/* ── SHADOW MODE ── */
.shadow-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 24px 16px; background: var(--bg); text-align: center; overflow: hidden; }
.shadow-counter { font-size: 12px; color: var(--text-hint); align-self: flex-start; display: flex; gap: 16px; align-items: center; width: 100%; font-family: var(--font-num); }
.shadow-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; width: 100%; }
.shadow-phonetic { font-size: 13px; color: var(--text-hint); line-height: 1.7; font-family: var(--font-en); }
.shadow-en { font-size: 20px; font-weight: 600; line-height: 1.4; letter-spacing: -0.4px; max-width: 320px; font-family: var(--font-en); }
.shadow-en .kw-pink { background: var(--kw-pink); padding: 2px 6px; border-radius: 6px; }
.shadow-en .kw-yellow { background: var(--kw-yellow); padding: 2px 6px; border-radius: 6px; }
.shadow-en .kw-purple { background: var(--kw-purple); padding: 2px 6px; border-radius: 6px; }
.shadow-zh { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.shadow-mic-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.shadow-mic-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); }
.shadow-mic-btn.recording { background: var(--accent2); border-color: var(--accent2); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(231,111,81,0.4); } 50% { box-shadow: 0 0 0 12px rgba(231,111,81,0); } }
.shadow-mic-hint { font-size: 12px; color: var(--text-hint); }
.shadow-rec-actions { display: flex; gap: 12px; }
.shadow-rec-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.shadow-play-btn { background: var(--accent); color: #fff; }
.shadow-del-btn { background: #fee2e2; color: #dc2626; }
.shadow-share-btn { background: var(--surface2); color: var(--text-secondary); border: 1px solid var(--border); }

/* ── VOCAB MODE ── */
.vocab-content { flex: 1; overflow-y: auto; background: var(--bg); }
.vocab-header-bar { padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.vocab-filters { display: flex; gap: 8px; }
.vocab-filter-btn { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: none; font-size: 12px; cursor: pointer; font-family: var(--font-zh); transition: all 0.15s; }
.vocab-filter-btn.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
.vocab-count { font-size: 12px; color: var(--text-hint); }
.vocab-item { padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; cursor: pointer; }
.vocab-num { font-size: 13px; color: var(--text-hint); width: 20px; text-align: right; flex-shrink: 0; font-family: var(--font-num); }
.vocab-word { font-size: 16px; font-weight: 500; flex: 1; font-family: var(--font-en); }
.vocab-meaning { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.vocab-badges { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
.vocab-level { font-size: 11px; padding: 2px 7px; border-radius: 4px; color: var(--accent); font-weight: 500; }
.vocab-type { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--accent2-light); color: var(--accent2); font-weight: 500; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px; width: 100%; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); position: relative; }
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal-word { font-size: 26px; font-weight: 600; margin-bottom: 4px; font-family: var(--font-en); }
.modal-phonetic { font-size: 13px; color: var(--text-hint); margin-bottom: 14px; font-family: var(--font-en); }
.modal-label { font-size: 11px; color: var(--text-hint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.modal-meaning { font-size: 15px; color: var(--text-secondary); margin-bottom: 16px; }
.modal-example { background: var(--surface2); border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
.modal-close { position: absolute; top: 20px; right: 20px; background: var(--surface2); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; padding: 8px 0 16px; z-index: 50; }
.bottom-nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-size: 10px; color: var(--text-hint); font-family: var(--font-zh); }
.bottom-nav-btn .bnav-icon { font-size: 22px; }
.bottom-nav-btn.active { color: var(--text-primary); }

/* Speed panel */
.speed-panel { position: absolute; bottom: 56px; left: 10px; background: var(--surface); border-radius: 12px; padding: 8px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; z-index: 10; opacity: 0; pointer-events: none; transform: translateY(8px); transition: all 0.2s; }
.speed-panel.open { opacity: 1; pointer-events: all; transform: translateY(0); }
.speed-opt { padding: 8px 14px; border-radius: 8px; border: none; background: none; font-size: 13px; cursor: pointer; text-align: left; }
.speed-opt:hover { background: var(--surface2); }
.speed-opt.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }

::-webkit-scrollbar { width: 0; }
.fade-in { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- HOME -->
<div class="home" id="homePage">
  <div class="home-header">
    <div>
      <div class="home-title-en">English Study Hub</div>
      <div class="home-title-zh">英语学习站</div>
    </div>
  </div>
  <div class="home-subtitle">Vlogs · Phonics · Songs for lifelong learners</div>
  <div class="home-tabs" id="homeTabs">
    <button class="home-tab-btn active" data-category="vlog">博主跟读</button>
    <button class="home-tab-btn" data-category="phonics">Oxford Phonics</button>
    <button class="home-tab-btn" data-category="song">歌曲跟唱</button>
  </div>
  <div class="episode-list" id="episodeList"></div>
</div>

<!-- PLAYER -->
<div class="player-page" id="playerPage">
  <div class="video-wrap" id="videoWrap">
    <div class="nav-row">
      <div class="nav-left">
        <button class="nav-btn" id="backBtn" data-icon="chevronDown"></button>
        <button class="nav-btn" id="prevEpBtn" data-icon="chevronLeft"></button>
        <button class="nav-btn" id="nextEpBtn" data-icon="chevronRight"></button>
      </div>
      <div class="nav-right">
        <button class="nav-btn" id="doneBtn" data-icon="check"></button>
      </div>
    </div>
    <div id="videoContainer"></div>
    <div class="loop-badge" id="loopBadge">
      <span class="loop-icon" data-icon="loop"></span>
      <span>循环之后暂停</span>
      <span class="loop-icon" data-icon="close"></span>
    </div>
  </div>

  <!-- Normal -->
  <div class="normal-content fade-in" id="tabContentNormal"><div id="subList"></div></div>

  <!-- Dictation -->
  <div class="dictation-content fade-in" id="tabContentDictation" style="display:none"><div id="dictList"></div></div>

  <!-- Shadow -->
  <div class="shadow-content fade-in" id="tabContentShadow" style="display:none">
    <div class="shadow-counter">
      <span id="shadowCounter">1 / 0</span>
      <span id="shadowEyeBtn" style="cursor:pointer;display:flex;" data-icon="eye"></span>
      <span id="shadowTime" style="margin-left:auto;">0:00 – 0:00</span>
    </div>
    <div class="shadow-main">
      <div class="shadow-phonetic" id="shadowPhonetic"></div>
      <div class="shadow-en" id="shadowEn"></div>
      <div class="shadow-zh" id="shadowZh"></div>
    </div>
    <div class="shadow-mic-area">
      <button class="shadow-mic-btn" id="micBtn" data-icon="mic"></button>
      <div class="shadow-mic-hint" id="micHint">点击录音，跟读这句话</div>
      <div class="shadow-rec-actions" id="shadowRecActions" style="display:none">
        <button class="shadow-rec-btn shadow-play-btn" id="shadowPlayRec" data-icon="play"></button>
        <button class="shadow-rec-btn shadow-del-btn" id="shadowDelRec" data-icon="trash"></button>
      </div>
    </div>
  </div>

  <!-- Vocab -->
  <div class="vocab-content fade-in" id="tabContentVocab" style="display:none">
    <div class="vocab-header-bar">
      <div class="vocab-filters">
        <button class="vocab-filter-btn active" data-filter="all">列表</button>
        <button class="vocab-filter-btn" data-filter="word">单词</button>
        <button class="vocab-filter-btn" data-filter="phrase">短语</button>
      </div>
      <span class="vocab-count" id="vocabCount">0 条</span>
    </div>
    <div id="vocabList"></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-track" id="progressTrack">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-times">
      <span class="progress-time" id="timeCurrent">0:00</span>
      <span class="progress-time" id="timeDuration">0:00</span>
    </div>
  </div>

  <div class="mode-bar" id="modeBar">
    <button class="mode-btn active" data-mode="sequential"><span class="mode-icon" data-icon="headphones"></span><span class="mode-label">顺序播放</span></button>
    <button class="mode-btn" data-mode="blind"><span class="mode-icon" data-icon="eyeOff"></span><span class="mode-label">盲听模式</span></button>
    <button class="mode-btn" data-mode="shadow"><span class="mode-icon" data-icon="waveform"></span><span class="mode-label">跟读对比</span></button>
    <button class="mode-btn" data-mode="dictation"><span class="mode-icon" data-icon="pencil"></span><span class="mode-label">听写模式</span></button>
    <button class="mode-btn" data-mode="vocab"><span class="mode-icon" data-icon="card"></span><span class="mode-label">词卡</span></button>
  </div>

  <div class="controls" style="position:relative">
    <div class="speed-panel" id="speedPanel">
      <button class="speed-opt" data-speed="0.5">0.5x</button>
      <button class="speed-opt" data-speed="0.75">0.75x</button>
      <button class="speed-opt active" data-speed="1">1x 正常</button>
      <button class="speed-opt" data-speed="1.25">1.25x</button>
      <button class="speed-opt" data-speed="1.5">1.5x</button>

<script>
// ── Icons (line-style SVG, replaces emoji throughout) ──
const ICONS = {

  book: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 4h6v16H6a2 2 0 0 1-2-2z"/><path d="M20 5.5A2 2 0 0 0 18 4h-6v16h6a2 2 0 0 0 2-2z"/></svg>`,
  mic: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="9" y1="21" x2="15" y2="21"/></svg>`,
  card: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/></svg>`,
  waveform: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="10" x2="3" y2="14"/><line x1="7" y1="6" x2="7" y2="18"/><line x1="11" y1="3" x2="11" y2="21"/><line x1="15" y1="6" x2="15" y2="18"/><line x1="19" y1="10" x2="19" y2="14"/></svg>`,

  stop: `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`,

  copy: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1.5 1.5 0 0 1 1.5-1.5H15"/></svg>`,
  film: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg>`,
  library: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>`,
  search: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>`,
  bookmark: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4z"/></svg>`,
  user: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>`,
};
function mountIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon] || ''; });
}

// ── State ──
let data = null, currentEpIdx = 0, currentSubIdx = 0, currentTab = 'normal';
let activeMode = 'sequential';
let currentCategory = 'vlog';
const categoryLabels = { vlog: '适合有基础学习者', phonics: '适合零基础', song: '跟唱练习' };
let isPlaying = false, loopEnabled = true, speed = 1, subHidden = false;
let videoEl = null;
let mediaRecorder = null, isRecording = false;
let shadowRecBlob = null, shadowRecUrl = null;
let vocabFilter = 'all';
let shadowZhHidden = false;
const kwColors = ['kw-pink','kw-yellow','kw-purple'];
mountIcons();

// ── Load data ──
async function loadData() {
  try {
    const res = await fetch('data.json');
    data = await res.json();
  } catch(e) {
    data = { episodes: [{ id:1, category:"vlog", title:"第 1 期", topic:"生活", accent:"英国", difficulty:2, description:"请放置 data.json 文件。", videoFile:"videos/ep1.mp4", thumbnail:"", duration:"2:43", date:"2026-06-03", subtitles:[], wordList:[] }] };
  }
  renderHome();
}

// ── Home ──
function renderHome() {
  const list = document.getElementById('episodeList');
  list.innerHTML = '';
  const episodes = data.episodes.filter(ep => ep.category === currentCategory);
  if (!episodes.length) {
    list.innerHTML = `<div class="episode-empty">暂无内容，敬请期待</div>`;
    return;
  }
  episodes.forEach((ep, i) => {
    const idx = data.episodes.indexOf(ep);
    const displayTitle = `第 ${i+1} 期`;
    const thumb = ep.thumbnail ? `<img src="${ep.thumbnail}" alt="">` : `<div class="ep-thumbnail-placeholder">${displayTitle}</div>`;
    const card = document.createElement('div');
    card.className = 'ep-card';
    card.innerHTML = `
      <div class="ep-thumbnail">${thumb}</div>
      <div class="ep-body">
        <div class="ep-top"><div class="ep-number">${displayTitle}</div><span class="ep-duration num">${ep.duration}</span></div>
        <div class="ep-tags">${ep.topic} · 口音：${ep.accent} · ${categoryLabels[ep.category] || ''}</div>
        <div class="ep-desc">${ep.description}</div>
        <div class="ep-meta">
          <div class="ep-stats"><span class="ep-stat">词汇量：<strong>${ep.wordList.length}</strong></span><span class="ep-stat"><strong>${ep.subtitles.length}</strong> 条字幕</span></div>
          <span class="ep-date">${ep.date}</span>
        </div>
      </div>`;
    card.onclick = () => openEpisode(idx);
    list.appendChild(card);
  });
}
document.querySelectorAll('.home-tab-btn').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('.home-tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentCategory = this.dataset.category;
    renderHome();
  };
});

// ── Episode ──
function openEpisode(idx) {
  currentEpIdx = idx; currentSubIdx = 0;
  document.getElementById('homePage').classList.add('hidden');
  document.getElementById('playerPage').classList.add('active');
  document.getElementById('bottomNav').style.display = 'none';
  loadEpisode();
}
function closeEpisode() {
  stopVideo();
  document.getElementById('homePage').classList.remove('hidden');
  document.getElementById('playerPage').classList.remove('active');
  document.getElementById('bottomNav').style.display = 'flex';
}
function loadEpisode() {
  const ep = data.episodes[currentEpIdx];
  const container = document.getElementById('videoContainer');
  container.innerHTML = '';
  if (ep.videoFile) {
    videoEl = document.createElement('video');
    videoEl.setAttribute('playsinline','');
    videoEl.setAttribute('webkit-playsinline','');
    videoEl.setAttribute('x5-playsinline','');
    videoEl.controls = true;
    videoEl.src = ep.videoFile;
    videoEl.style.cssText = 'width:100%;height:100%;display:block;';
    videoEl.playbackRate = speed;
    videoEl.addEventListener('timeupdate', onTimeUpdate);
    videoEl.addEventListener('ended', ()=>{ isPlaying=false; updatePlayBtn(); });
    videoEl.addEventListener('play', ()=>{ isPlaying=true; updatePlayBtn(); });
    videoEl.addEventListener('pause', ()=>{ isPlaying=false; updatePlayBtn(); });
    videoEl.addEventListener('loadedmetadata', ()=>{ document.getElementById('timeDuration').textContent = formatTime(videoEl.duration); });
    container.appendChild(videoEl);
  } else {
    videoEl = null;
    container.innerHTML = `<div class="video-placeholder">${ICONS.film}<span>请设置 videoFile</span></div>`;
  }
  document.getElementById('timeDuration').textContent = ep.duration || '0:00';
  renderNormal(); renderDictation(); renderShadow(); renderVocab();
  activeMode = 'sequential'; subHidden = false;
  switchTab('normal');
  updateModeButtons();
  document.getElementById('modeBar').classList.remove('collapsed');
}

// ── Video controls ──
function playVideo() { if (videoEl) videoEl.play().catch(()=>{}); }
function pauseVideo() { if (videoEl) videoEl.pause(); }
function stopVideo() { if (videoEl) { videoEl.pause(); videoEl.currentTime = 0; } isPlaying = false; }
function seekTo(t) { if (videoEl) videoEl.currentTime = t; }
function togglePlay() { if (isPlaying) pauseVideo(); else playVideo(); }
function updatePlayBtn() { document.querySelector('#playBtn .ctrl-icon').innerHTML = isPlaying ? ICONS.pause : ICONS.play; }

function onTimeUpdate() {
  if (!videoEl) return;
  const t = videoEl.currentTime, dur = videoEl.duration || 1;
  document.getElementById('progressFill').style.width = (t/dur*100)+'%';
  document.getElementById('timeCurrent').textContent = formatTime(t);
  const ep = data.episodes[currentEpIdx];
  const idx = ep.subtitles.findIndex(s => t >= s.start && t < s.end);
  if (idx !== -1 && idx !== currentSubIdx) {
    currentSubIdx = idx;
    highlightActiveSub();
    if (currentTab === 'shadow') renderShadow();
    if (currentTab === 'dictation') highlightDictItem();
  }
  if (loopEnabled && currentTab === 'shadow') {
    const sub = ep.subtitles[currentSubIdx];
    if (sub && t >= sub.end - 0.1) seekTo(sub.start);
  }
  // 听写模式：播放到句末自动暂停
  if (currentTab === 'dictation') {
    const sub = ep.subtitles[currentSubIdx];
    if (sub && t >= sub.end - 0.1) pauseVideo();
  }
}

document.getElementById('progressTrack').addEventListener('click', function(e) {
  if (!videoEl) return;
  const rect = this.getBoundingClientRect();
  videoEl.currentTime = (e.clientX - rect.left) / rect.width * videoEl.duration;
});

function prevSentence() {
  const ep = data.episodes[currentEpIdx];
  if (currentSubIdx > 0) {
    currentSubIdx--;
    seekTo(ep.subtitles[currentSubIdx].start);
    highlightActiveSub();
    if (currentTab==='shadow') renderShadow();
    if (currentTab==='dictation') { highlightDictItem(); pauseVideo(); }
  }
}
function nextSentence() {
  const ep = data.episodes[currentEpIdx];
  if (currentSubIdx < ep.subtitles.length-1) {
    currentSubIdx++;
    seekTo(ep.subtitles[currentSubIdx].start);
    highlightActiveSub();
    if (currentTab==='shadow') renderShadow();
    if (currentTab==='dictation') { highlightDictItem(); pauseVideo(); }
  }
}
// ── Highlight ──
function highlightText(text, keywords) {
  if (!keywords||!keywords.length) return text;
  let result = text;
  keywords.forEach((kw,i) => {
    const color = kwColors[i%kwColors.length];
    result = result.replace(new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), `<span class="${color}">$1</span>`);
  });
  return result;
}

// ── Normal mode ──
function renderNormal() {
  const ep = data.episodes[currentEpIdx];
  const list = document.getElementById('subList');
  list.innerHTML = '';
  ep.subtitles.forEach((sub, idx) => {
    const div = document.createElement('div');
    div.className = 'sub-item' + (idx===currentSubIdx?' active':'');
    div.id = `sub-${idx}`;
    const enText = subHidden ? `<span style="filter:blur(5px)">${sub.en}</span>` : highlightText(sub.en, sub.keywords);
    div.innerHTML = `
      <div class="sub-en">${enText}</div>
      <div class="sub-zh">${sub.zh}</div>
      <div class="sub-footer">
        <span class="sub-num">${sub.id} &nbsp; ${formatTime(sub.start)} – ${formatTime(sub.end)}</span>
        <div class="sub-actions">
          <button class="sub-action" onclick="playFromSub(${idx})">${ICONS.play}</button>
          <button class="sub-action" onclick="copyText('${sub.en.replace(/'/g,"\\'")}')" title="复制">${ICONS.copy}</button>
        </div>
      </div>`;
    div.addEventListener('click', (e) => {
      if (e.target.closest('.sub-actions')) return;
      currentSubIdx = idx; seekTo(sub.start); playVideo(); highlightActiveSub();
    });
    list.appendChild(div);
  });
}

function highlightActiveSub() {
  document.querySelectorAll('.sub-item').forEach((el,i) => el.classList.toggle('active', i===currentSubIdx));
  const el = document.getElementById(`sub-${currentSubIdx}`);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}
function highlightDictItem() {
  document.querySelectorAll('.dict-item').forEach((el,i) => el.style.background = i===currentSubIdx ? 'var(--accent-light)' : '');
  const el = document.getElementById(`dict-${currentSubIdx}`);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

function playFromSub(idx) { currentSubIdx=idx; seekTo(data.episodes[currentEpIdx].subtitles[idx].start); playVideo(); highlightActiveSub(); }
function copyText(text) { navigator.clipboard?.writeText(text).catch(()=>{}); }

// ── Dictation mode ──
function renderDictation() {
  const ep = data.episodes[currentEpIdx];
  const list = document.getElementById('dictList');
  list.innerHTML = '';
  ep.subtitles.forEach((sub, idx) => {
    const div = document.createElement('div');
    div.className = 'dict-item';
    div.id = `dict-${idx}`;
    div.innerHTML = `
      <div class="dict-header">
        <span class="dict-num">${sub.id} / ${ep.subtitles.length}</span>
        <div class="dict-actions">
          <button class="dict-action" onclick="playFromSub(${idx})">${ICONS.play}</button>
        </div>
        <span class="dict-time">${formatTime(sub.start)} – ${formatTime(sub.end)}</span>
      </div>
      <div class="dict-input-wrap">
        <textarea class="dict-input" id="dict-input-${idx}" placeholder="开始听写吧..." rows="2"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="dict-check-btn" onclick="checkDictation(${idx},'${sub.en.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">核对</button>
        <button class="dict-reveal-btn" onclick="revealDictation(${idx},'${sub.en.replace(/'/g,"\\'").replace(/"/g,'&quot;')}','${sub.zh.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">查看原文</button>
      </div>
      <div class="dict-answer" id="dict-answer-${idx}"></div>`;
    list.appendChild(div);
  });
}

function checkDictation(idx, answer) {
  const input = document.getElementById(`dict-input-${idx}`);
  const answerEl = document.getElementById(`dict-answer-${idx}`);
  const userText = input.value.trim().toLowerCase();
  const correctText = answer.toLowerCase().replace(/["""]/g,'');
  const isCorrect = userText === correctText || userText.replace(/[^a-z0-9 ]/g,'') === correctText.replace(/[^a-z0-9 ]/g,'');
  input.className = 'dict-input ' + (isCorrect ? 'correct' : 'wrong');
  answerEl.textContent = '原文：' + answer;
  answerEl.className = 'dict-answer show';
}

function revealDictation(idx, en, zh) {
  const answerEl = document.getElementById(`dict-answer-${idx}`);
  answerEl.innerHTML = `<strong>原文：</strong>${en}<br><span style="color:var(--text-hint)">${zh}</span>`;
  answerEl.className = 'dict-answer show';
}

// ── Shadow mode ──
function renderShadow() {
  const ep = data.episodes[currentEpIdx];
  const sub = ep.subtitles[currentSubIdx];
  if (!sub) return;
  document.getElementById('shadowCounter').textContent = `${currentSubIdx+1} / ${ep.subtitles.length}`;
  document.getElementById('shadowTime').textContent = `${formatTime(sub.start)} – ${formatTime(sub.end)}`;
  document.getElementById('shadowPhonetic').textContent = sub.phonetic || '';
  document.getElementById('shadowEn').innerHTML = highlightText(sub.en, sub.keywords);
  document.getElementById('shadowZh').textContent = shadowZhHidden ? '' : sub.zh;
  // reset mic state
  shadowRecBlob = null; shadowRecUrl = null;
  document.getElementById('shadowRecActions').style.display = 'none';
  document.getElementById('micBtn').innerHTML = ICONS.mic;
  document.getElementById('micHint').textContent = '点击录音，跟读这句话';
}

// Eye toggle for zh
document.getElementById('shadowEyeBtn').addEventListener('click', function() {
  shadowZhHidden = !shadowZhHidden;
  this.innerHTML = shadowZhHidden ? ICONS.eyeOffSmall : ICONS.eye;
  renderShadow();
});

// Mic button
document.getElementById('micBtn').addEventListener('click', async function() {
  if (isRecording) {
    if (mediaRecorder) mediaRecorder.stop();
    isRecording = false;
    this.classList.remove('recording');
    this.innerHTML = ICONS.mic;
    document.getElementById('micHint').textContent = '正在处理…';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    // 录音开始：暂停视频
    pauseVideo();
    mediaRecorder.start();
    isRecording = true;
    this.classList.add('recording');
    this.innerHTML = ICONS.stop;
    document.getElementById('micHint').textContent = '录音中…再次点击停止';
    mediaRecorder.addEventListener('dataavailable', e => { if (e.data.size > 0) chunks.push(e.data); });
    mediaRecorder.addEventListener('stop', () => {
      stream.getTracks().forEach(t => t.stop());
      // 尝试多种格式兼容iOS
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' :
                       MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
      shadowRecBlob = new Blob(chunks, { type: mimeType });
      shadowRecUrl = URL.createObjectURL(shadowRecBlob);
      document.getElementById('shadowRecActions').style.display = 'flex';
      document.getElementById('micHint').textContent = '录音完成，点击播放对比';
      document.getElementById('micBtn').innerHTML = ICONS.mic;
      isRecording = false;
      // 录音结束：重新播放视频
      const ep = data.episodes[currentEpIdx];
      const sub = ep.subtitles[currentSubIdx];
      if (sub) { seekTo(sub.start); playVideo(); }
    });
  } catch(e) {
    document.getElementById('micHint').textContent = '需要麦克风权限';
  }
});

document.getElementById('shadowPlayRec').onclick = function() {
  if (!shadowRecUrl) return;
  // 暂停视频
  pauseVideo();
  const audio = new Audio();
  audio.src = shadowRecUrl;
  audio.play().catch(err => {
    console.log('播放失败:', err);
  });
  // 播放完后恢复视频
  audio.addEventListener('ended', () => {
    const ep = data.episodes[currentEpIdx];
    const sub = ep.subtitles[currentSubIdx];
    if (sub) { seekTo(sub.start); playVideo(); }
  });
};
document.getElementById('shadowDelRec').onclick = () => {
  shadowRecBlob = null; shadowRecUrl = null;
  document.getElementById('shadowRecActions').style.display = 'none';
  document.getElementById('micHint').textContent = '点击录音，跟读这句话';
};

// ── Vocab mode ──
function renderVocab() {
  const ep = data.episodes[currentEpIdx];
  const words = ep.wordList.filter(w => {
    if (vocabFilter==='all') return true;
    if (vocabFilter==='word') return w.type==='单词';
    if (vocabFilter==='phrase') return w.type==='短语';
    return true;
  });
  document.getElementById('vocabCount').textContent = words.length + ' 条';
  const list = document.getElementById('vocabList');
  list.innerHTML = '';
  words.forEach((w,i) => {
    const div = document.createElement('div');
    div.className = 'vocab-item';
    div.innerHTML = `
      <span class="vocab-num">${i+1}</span>
      <div style="flex:1"><div class="vocab-word">${w.word}</div><div class="vocab-meaning">${w.meaning}</div></div>
      <div class="vocab-badges"><span class="vocab-level">${w.level}</span><span class="vocab-type">${w.type}</span></div>
      <span style="color:var(--text-hint);display:flex">${ICONS.chevronRight}</span>`;
    div.onclick = () => openVocabModal(w);
    list.appendChild(div);
  });
}

function openVocabModal(w) {
  document.getElementById('modalWord').textContent = w.word;
  document.getElementById('modalPhonetic').textContent = w.phonetic || '';
  document.getElementById('modalMeaning').textContent = w.meaning;
  document.getElementById('modalExample').textContent = w.example || '（暂无例句）';
  document.getElementById('vocabModal').classList.add('open');
}
document.getElementById('modalClose').onclick = () => document.getElementById('vocabModal').classList.remove('open');
document.getElementById('vocabModal').addEventListener('click', function(e) { if (e.target===this) this.classList.remove('open'); });
document.querySelectorAll('.vocab-filter-btn').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('.vocab-filter-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    vocabFilter = this.dataset.filter;
    renderVocab();
  };
});

// ── Tabs ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabContentNormal').style.display = tab==='normal' ? 'block' : 'none';
  document.getElementById('tabContentDictation').style.display = tab==='dictation' ? 'block' : 'none';
  document.getElementById('tabContentShadow').style.display = tab==='shadow' ? 'flex' : 'none';
  document.getElementById('tabContentVocab').style.display = tab==='vocab' ? 'block' : 'none';
  if (videoEl) videoEl.muted = false;
  if (tab==='shadow') {
    renderShadow();
    const ep = data.episodes[currentEpIdx];
    const sub = ep.subtitles[currentSubIdx];
    if (sub) { seekTo(sub.start); playVideo(); }
  }
  if (tab==='dictation') {
    const ep = data.episodes[currentEpIdx];
    const sub = ep.subtitles[currentSubIdx];
    if (sub) { seekTo(sub.start); pauseVideo(); }
  }
}

// ── Mode bar (顺序播放 / 盲听 / 阅读模式 / 跟读原文 / 单词训练) ──
function selectMode(mode) {
  if (mode === 'sequential' || mode === 'blind') {
    if (activeMode === mode && currentTab === 'normal') {
      subHidden = !subHidden;
    } else {
      subHidden = (mode === 'blind');
      switchTab('normal');
    }
    renderNormal();
  } else {
    switchTab(mode);
  }
  activeMode = mode;
  updateModeButtons();
}
function updateModeButtons() {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode===activeMode));
}
document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click', () => selectMode(btn.dataset.mode)));

// ── Controls ──
document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevSentBtn').onclick = prevSentence;
document.getElementById('nextSentBtn').onclick = nextSentence;
document.getElementById('backBtn').onclick = closeEpisode;
document.getElementById('doneBtn').onclick = closeEpisode;
document.getElementById('prevEpBtn').onclick = () => { if (currentEpIdx>0) { currentEpIdx--; loadEpisode(); } };
document.getElementById('nextEpBtn').onclick = () => { if (currentEpIdx<data.episodes.length-1) { currentEpIdx++; loadEpisode(); } };
document.getElementById('listToggleBtn').addEventListener('click', function() {
  document.getElementById('modeBar').classList.toggle('collapsed');
});
document.getElementById('loopBadge').onclick = () => {
  loopEnabled = !loopEnabled;
  document.getElementById('loopBadge').style.opacity = loopEnabled ? '1' : '0.4';
};
document.getElementById('speedBtn').onclick = function(e) { e.stopPropagation(); document.getElementById('speedPanel').classList.toggle('open'); };
document.querySelectorAll('.speed-opt').forEach(btn => {
  btn.onclick = function() {
    speed = parseFloat(this.dataset.speed);
    if (videoEl) videoEl.playbackRate = speed;
    document.querySelectorAll('.speed-opt').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('speedLabel').textContent = speed+'x 倍速';
    document.getElementById('speedPanel').classList.remove('open');
  };
});
document.addEventListener('click', () => document.getElementById('speedPanel').classList.remove('open'));

// ── Utils ──
function formatTime(s) {
  if (!s && s!==0) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m+':'+String(sec).padStart(2,'0');
}

loadData();
</script>
